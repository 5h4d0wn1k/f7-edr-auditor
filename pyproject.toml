[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edr-auditor"
version = "1.0.0"
description = "Blue-team endpoint hardening auditor (persistence, services, sockets, patches, hardening) for machines you own. Runs only against systems you are authorized to audit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "5h4d0wn1k", email = "5h4d0wn1k@users.noreply.github.com" },
]
keywords = ["security", "blue-team", "hardening", "audit", "endpoint", "EDR", "forensics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
edr = "edr_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edr_auditor = []